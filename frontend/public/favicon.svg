<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Premium Gold Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6c364" />
      <stop offset="50%" stop-color="#c9a84c" />
      <stop offset="100%" stop-color="#ae8c33" />
    </linearGradient>
    <!-- Subtle glow / drop shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Circle representing Vercel/Stripe style -->
  <rect width="32" height="32" rx="8" fill="#0d0f12" />
  
  <!-- Outer border -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Geometric Analytics Icon (Gold node/chart symbol) -->
  <g filter="url(#glow)">
    <!-- Main gold nodes connected -->
    <circle cx="10" cy="22" r="2.5" fill="url(#gold-grad)" />
    <circle cx="17" cy="13" r="2.5" fill="url(#gold-grad)" />
    <circle cx="24" cy="10" r="2.5" fill="url(#gold-grad)" />
    
    <!-- Connection lines -->
    <path d="M10 22 L17 13 L24 10" fill="none" stroke="url(#gold-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>